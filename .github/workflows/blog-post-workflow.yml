name: Latest blog posts
on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch:       # manual run button

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "RSS_FEED_URL"
          max_post_count: 5
